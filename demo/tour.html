<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lightbox tour</title>
  <meta name="description" content="A looping tour of the viewer for recordings.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../lightbox.css">
  <link rel="stylesheet" href="demo.css">
  <link rel="stylesheet" href="tour.css">
  <script type="module" src="tour.js"></script>
</head>
<body>
  <main class="tour">
    <a class="tile" href="images/penguin-woodblock.webp" data-lightbox="tour" data-caption="Woodblock print, above the waves"><img src="images/penguin-woodblock.webp" alt="drk's penguin as a woodblock print" width="520" height="520"></a>
    <a class="shot" href="images/charts.webp" data-lightbox="tour" data-width="2880" data-height="1800" data-caption="charts: zoom in to read every number"><img src="images/charts-thumb.webp" alt="The charts demo" width="640" height="400"></a>
    <a class="tile" href="images/penguin-ninja.webp" data-lightbox="tour" data-caption="Ninja, cherry blossoms behind"><img src="images/penguin-ninja.webp" alt="drk's penguin as a ninja" width="520" height="520"></a>
    <a class="shot" href="images/motion.webp" data-lightbox="tour" data-width="2880" data-height="1800" data-caption="motion: buttons, icons, tabs and a counter"><img src="images/motion-thumb.webp" alt="The motion tour" width="640" height="400"></a>
    <a class="tile" href="images/penguin-riso.webp" data-lightbox="tour" data-caption="Riso-print sticker"><img src="images/penguin-riso.webp" alt="drk's penguin as a riso-print sticker" width="520" height="520"></a>
    <a class="tile" href="images/penguin-laser.webp" data-lightbox="tour" data-caption="Laser eyes"><img src="images/penguin-laser.webp" alt="drk's penguin with red laser eyes" width="520" height="520"></a>
  </main>
</body>
</html>
